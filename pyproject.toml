# Generic uv environment for the native SAM-V model.
#
# This file replaces the legacy pip requirements for uv users. It keeps the
# repository's own pins where they are load-bearing:
#   * torch 2.8.0 / torchvision 0.23.0 are the CUDA-12.8 builds. They are needed
#     for Blackwell (sm_120) GPUs; the old torch 2.3.1/cu121 pin has no sm_120
#     kernels.
#   * timm is held at 1.0.22. timm 1.0.23 moved RotaryEmbedding out of
#     timm.layers.attention_pool2d while its timm.models.layers shim still
#     imports it, which breaks the patched sam-hq fork at model construction.
#
# The native packages `segment_anything` (submodules/sam-hq) and `vggt`
# (submodules/vggt) are not PyPI dependencies. They are consumed from the pinned
# git submodules via PYTHONPATH, exactly as the README describes.
#
# `uv sync` installs a CPU-importable environment. That is not by itself proof
# that the CUDA kernels run on a given GPU; GPU execution must be validated
# separately on the target device.

[project]
name = "sam-v"
version = "0.1.0"
description = "Native SAM-V multi-view promptable segmentation environment"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "timm==1.0.22",
    "numpy>=1.26,<2",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "imageio>=2.31",
    "tifffile>=2023.7.10",
    "einops>=0.7",
    "safetensors>=0.4",
    "huggingface-hub>=0.30,<2",
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "wandb>=0.17",
    "protobuf>=4.25",
    "requests>=2.31",
    "packaging>=23.0",
    "threadpoolctl>=3.1",
    "lazy-loader>=0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
